<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f8fd">
  <meta name="description" content="枝幕是面向剧本开发的多模型故事画布。逐拍发散、比较分支、标注情绪曲线，并导出主线大纲。">
  <title>枝幕 · 剧本创作画布</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/icons/style.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i class="ph ph-tree-structure"></i></span>
      <strong>枝幕</strong><span class="brand-description">剧本创作画布</span>
    </div>
    <div class="workspace-crumb"><i class="ph ph-folder" aria-hidden="true"></i><span id="crumb-title"></span></div>
    <div class="top-actions">
      <span class="save-state" id="save-state" role="status"><i class="ph ph-check-circle" aria-hidden="true"></i>已保存至本机</span>
      <button class="button secondary" data-action="models" id="models-button"><i class="ph ph-cpu" aria-hidden="true"></i><span>模型</span></button>
      <button class="button primary" data-action="export"><i class="ph ph-export" aria-hidden="true"></i><span>导出</span></button>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="项目和四拍推演"></aside>
    <section class="work-area" aria-label="故事工作区">
      <div class="work-header">
        <div class="view-switch" aria-label="故事视图">
          <button class="view-tab" id="board-tab" data-action="board" aria-pressed="true"><i class="ph ph-graph" aria-hidden="true"></i>故事画布</button>
          <button class="view-tab" id="outline-tab" data-action="outline" aria-pressed="false"><i class="ph ph-list-bullets" aria-hidden="true"></i>主线大纲</button>
        </div>
        <div class="work-actions">
          <div class="history-tools">
            <button class="icon-button" id="undo" data-action="undo" title="撤销" aria-label="撤销"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i></button>
            <button class="icon-button" id="redo" data-action="redo" title="重做" aria-label="重做"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i></button>
          </div>
          <button class="button secondary compact" id="link-button" data-action="link" aria-pressed="false" title="点击两个节点添加因果连线"><i class="ph ph-link-simple" aria-hidden="true"></i><span>连线</span></button>
          <button class="button primary compact" data-action="add-node"><i class="ph ph-plus" aria-hidden="true"></i><span>节点</span></button>
        </div>
      </div>
      <div id="surface" class="surface">
        <div class="viewport" id="viewport" aria-label="可拖拽的故事画布">
          <canvas id="wires" class="wires" aria-hidden="true"></canvas>
          <div id="world" class="world"></div>
          <div class="canvas-top" id="canvas-top">
            <div class="graph-legend"><span><i class="line-sample main" aria-hidden="true"></i>主线</span><span><i class="line-sample option" aria-hidden="true"></i>备选</span><span class="cause-legend" id="cause-legend" hidden><i class="line-sample cause" aria-hidden="true"></i>因果</span></div>
            <button class="button light compact" id="filter-button" data-action="filter" aria-pressed="false" title="仅看主线"><i class="ph ph-funnel-simple" aria-hidden="true"></i><span>全图</span></button>
          </div>
          <div id="canvas-empty" class="canvas-empty" hidden></div>
          <div class="canvas-bottom">
            <div class="zoom-tools" aria-label="画布导航">
              <button class="icon-button" data-action="zoom-out" aria-label="缩小" title="缩小"><i class="ph ph-minus" aria-hidden="true"></i></button>
              <button class="zoom-label" id="zoom-value" data-action="zoom-reset" title="恢复 100%">100%</button>
              <button class="icon-button" data-action="zoom-in" aria-label="放大" title="放大"><i class="ph ph-plus" aria-hidden="true"></i></button>
              <span class="tool-divider"></span>
              <button class="icon-button" data-action="fit" aria-label="适配画布" title="适配画布"><i class="ph ph-corners-out" aria-hidden="true"></i></button>
              <button class="icon-button arrange-button" data-action="arrange" aria-label="自动排布" title="自动排布"><i class="ph ph-layout" aria-hidden="true"></i></button>
            </div>
            <span id="canvas-status" class="canvas-status"></span>
            <canvas id="minimap" class="minimap" title="点击小地图定位" aria-label="画布小地图" tabindex="0"></canvas>
          </div>
        </div>
        <div id="outline" class="outline" hidden></div>
      </div>
      <section class="emotion-panel" id="emotion-panel" aria-label="主线情绪曲线">
        <div class="emotion-header">
          <div class="emotion-title"><i class="ph ph-wave-sine" aria-hidden="true"></i><h2>情绪曲线</h2></div>
          <div class="emotion-legend"><span><i class="dot violet" aria-hidden="true"></i>情绪</span><span><i class="dot amber" aria-hidden="true"></i>张力</span></div>
          <div class="emotion-actions">
            <button class="button light compact" data-action="assess" id="assess-button"><i class="ph ph-sparkle" aria-hidden="true"></i><span>AI 标注</span></button>
            <button class="icon-button" data-action="toggle-chart" id="chart-toggle" aria-label="折叠曲线" aria-expanded="true" title="折叠曲线"><i class="ph ph-caret-down" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="chart-scroll" id="chart-scroll">
          <div class="chart-plot" id="chart-plot"><canvas id="chart" aria-hidden="true"></canvas><div id="chart-points" class="chart-points"></div></div>
        </div>
      </section>
    </section>
    <aside class="inspector" id="inspector" aria-label="编剧台"></aside>
  </main>
  <div class="mobile-bar" aria-label="移动端面板">
    <button class="button light" data-action="mobile-project"><i class="ph ph-squares-four" aria-hidden="true"></i>项目与结构</button>
    <button class="button light" data-action="mobile-inspector"><i class="ph ph-sparkle" aria-hidden="true"></i>编剧台</button>
  </div>
  <button id="mobile-scrim" class="mobile-scrim" data-action="mobile-close" aria-label="关闭侧栏" hidden></button>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
