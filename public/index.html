<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <meta name="description" content="枝幕是面向剧本开发的多模型故事画布。">
  <title>枝幕 · 剧本创作画布</title>
  <link rel="icon" href="/assets/syz.png">
  <link rel="preload" as="image" href="/assets/canvas-ip.png">
  <link rel="stylesheet" href="/vendor/icons/style.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/chrome.css">
  <link rel="stylesheet" href="/board.css">
</head>
<body>
  <div class="launch-screen" id="launch-screen" aria-hidden="true">
    <div class="launch-mark"><img src="/assets/syz.png" alt=""><strong>枝幕</strong></div>
  </div>
  <section id="login-screen" class="login-screen" aria-label="登录与注册" hidden></section>
  <div id="app-shell" hidden>
    <header class="home-topbar" id="home-header">
      <div class="brand"><img src="/assets/syz.png" alt="SYZ"><strong>枝幕</strong></div>
      <button class="account-button" type="button" data-action="account" aria-haspopup="menu" aria-expanded="false">
        <span class="account-avatar" data-account-avatar aria-hidden="true"></span><span data-account-name></span><i class="ph ph-caret-down" aria-hidden="true"></i>
      </button>
    </header>
    <main id="home-screen" class="home-screen" aria-label="项目首页"></main>
    <main id="workspace-screen" class="workspace" hidden>
      <div class="viewport" id="viewport" role="region" tabindex="0" data-tool="select" aria-label="故事画布，左键拖动框选，双击添加节点">
        <canvas id="wires" class="wires" aria-hidden="true"></canvas>
        <div id="world" class="world"><div id="groups"></div><div id="nodes"></div></div>
        <canvas id="ink" class="canvas-ink" aria-hidden="true" hidden></canvas>
        <div id="selection-box" class="selection-box" aria-hidden="true" hidden></div>
        <div id="canvas-empty" class="canvas-empty" aria-hidden="true" hidden>
          <i class="ph ph-graph"></i><p>右键或双击空白处添加节点</p>
        </div>
        <section id="node-composer" class="node-composer" aria-label="节点编辑与生成" data-board-overlay hidden></section>
        <header class="canvas-chrome" data-board-overlay>
          <div class="canvas-project-controls">
            <button class="canvas-brand" type="button" data-action="home" title="返回主页" aria-label="返回主页">
              <i class="ph ph-arrow-left" aria-hidden="true"></i><img src="/assets/syz.png" alt="">
            </button>
            <button id="current-method" class="canvas-method" type="button" data-action="method" aria-haspopup="dialog" title="选择创作方法">
              <i class="ph ph-compass" aria-hidden="true"></i><span>自由创作</span><i class="ph ph-caret-down" aria-hidden="true"></i>
            </button>
          </div>
          <button class="account-button" type="button" data-action="account" aria-haspopup="menu" aria-expanded="false">
            <span class="account-avatar" data-account-avatar aria-hidden="true"></span><span data-account-name></span><i class="ph ph-caret-down" aria-hidden="true"></i>
          </button>
        </header>
        <section class="emotion-panel" id="emotion-panel" aria-label="主线情绪曲线" data-board-overlay>
          <div class="emotion-header">
            <div class="emotion-title"><i class="ph ph-wave-sine" aria-hidden="true"></i><h2>情绪曲线</h2></div>
            <div class="emotion-legend"><span><i class="dot violet" aria-hidden="true"></i>情绪</span><span><i class="dot amber" aria-hidden="true"></i>张力</span></div>
            <div class="emotion-actions">
              <button class="button quiet compact review-count" type="button" data-action="mainline" id="review-mainline" hidden></button>
              <button class="button quiet compact" type="button" data-action="assess" id="assess-button"><i class="ph ph-sparkle" aria-hidden="true"></i><span>AI 标注</span></button>
              <button class="icon-button" type="button" data-action="toggle-chart" id="chart-toggle" aria-controls="chart-scroll" aria-label="折叠曲线" aria-expanded="true" title="折叠曲线"><i class="ph ph-caret-down" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="chart-scroll" id="chart-scroll">
            <div class="chart-plot" id="chart-plot"><canvas id="chart" aria-hidden="true"></canvas><div id="chart-points" class="chart-points"></div></div>
          </div>
        </section>
        <canvas id="minimap" class="canvas-minimap" data-board-overlay aria-label="画布小地图，点击定位" hidden></canvas>
        <div class="canvas-left-dock" data-board-overlay>
          <button id="method-gift" class="icon-button gift-button" type="button" data-action="method-pricing" aria-label="解锁创作方法" title="解锁创作方法"><i class="ph ph-gift" aria-hidden="true"></i></button>
          <div class="canvas-dock zoom-dock" role="group" aria-label="画布视图">
            <button class="icon-button" type="button" data-action="zoom-out" title="缩小" aria-label="缩小"><i class="ph ph-minus" aria-hidden="true"></i></button>
            <button id="zoom-value" class="zoom-value" type="button" data-action="zoom-reset" title="恢复到 100%" aria-label="恢复到 100%">100%</button>
            <button class="icon-button" type="button" data-action="zoom-in" title="放大" aria-label="放大"><i class="ph ph-plus" aria-hidden="true"></i></button>
            <button class="icon-button" type="button" data-action="fit" title="适配画布" aria-label="适配画布"><i class="ph ph-corners-out" aria-hidden="true"></i></button>
            <button class="icon-button" type="button" data-action="minimap" title="小地图" aria-label="小地图" aria-pressed="false"><i class="ph ph-map-trifold" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="canvas-dock canvas-toolbar" role="group" aria-label="画布工具" data-board-overlay>
          <button class="icon-button" type="button" data-action="board-tool" data-id="select" aria-pressed="true" title="选择与左键框选 (V)" aria-label="选择与左键框选"><i class="ph ph-cursor" aria-hidden="true"></i></button>
          <button class="icon-button" type="button" data-action="board-tool" data-id="hand" aria-pressed="false" title="抓手 (H / 空格)" aria-label="抓手"><i class="ph ph-hand" aria-hidden="true"></i></button>
          <span class="dock-divider" aria-hidden="true"></span>
          <button class="icon-button" type="button" data-action="board-tool" data-id="ink" aria-pressed="false" title="画笔 (P)" aria-label="画笔"><i class="ph ph-pencil" aria-hidden="true"></i></button>
          <button class="icon-button idea-tool" type="button" data-action="board-tool" data-id="idea" aria-pressed="false" title="添加点子" aria-label="添加点子"><i class="ph ph-lightbulb" aria-hidden="true"></i></button>
          <button class="icon-button" type="button" data-action="group-nodes" title="框选至少两个节点后分组" aria-label="将所选节点分组" disabled><i class="ph ph-stack" aria-hidden="true"></i></button>
          <button class="icon-button" type="button" data-action="board-tool" data-id="text" aria-pressed="false" title="添加文本" aria-label="添加文本"><i class="ph ph-text-t" aria-hidden="true"></i></button>
          <span class="dock-divider" aria-hidden="true"></span>
          <button class="icon-button" type="button" data-action="find-node" title="查找节点 (Ctrl+F)" aria-label="查找节点"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button>
          <button class="button add-dock-button" type="button" data-action="dock-add"><i class="ph ph-plus" aria-hidden="true"></i>添加节点</button>
        </div>
      </div>
    </main>
  </div>
  <div id="canvas-menu" class="pop-menu" role="menu" hidden></div>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <input type="file" id="script-file" accept=".docx,.pdf,.md,.txt,.fountain" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
